name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - run: ./gradlew build

      - name: 테스트 결과 표시
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: 차트 lint
        run: helm lint infra/helm/inventory

      - name: 차트 렌더링
        run: helm template inventory infra/helm/inventory > rendered.yaml

      - name: k8s 스키마 검사
        run: docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary /w/rendered.yaml

  # ── main에 push되면 배포 ─────────────────────────────────────
  # 테스트, 차트 검사 통과 → 이미지 빌드, push → values.yaml의 tag를 커밋 SHA로 수정해 main에 push
  # → ArgoCD가 변경을 감지해 클러스터에 배포한다. CI는 클러스터에 접근하지 않는다
  #
  # Settings > Secrets and variables > Actions 에 등록
  #   vars.DOCKERHUB_USERNAME : Docker Hub 아이디
  #   secrets.DOCKERHUB_TOKEN : Docker Hub access token

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, helm]        # 테스트나 차트 검사가 실패하면 실행되지 않는다
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: inventory-app
            dockerfile: app/Dockerfile
          - name: inventory-flyway
            dockerfile: support/flyway/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # latest 대신 커밋 SHA를 태그로 → values.yaml이 바뀌어야 ArgoCD가 감지한다
          tags: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ github.sha }}

  update-tag:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write           # main에 tag 커밋을 push한다. GITHUB_TOKEN으로 push한 커밋은 CI를 다시 실행하지 않는다
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: image tag 수정 후 commit, push
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ github.sha }}\"/" infra/helm/inventory/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: inventory ${{ github.sha }}"
          git push
