name: 작업
description: 빌드, CI, 배포, 문서 등 기능 외 작업
title: "chore(<scope>): "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: 유형이 chore가 아니면 제목 접두사와 라벨을 ci, deploy, docs, test, refactor 중 하나로 바꿉니다.
  - type: textarea
    id: background
    attributes:
      label: 배경, 목적
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      placeholder: |
        - GitHub Actions에 빌드와 테스트 워크플로 추가
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] PR에서 CI가 실행된다
    validations:
      required: true
