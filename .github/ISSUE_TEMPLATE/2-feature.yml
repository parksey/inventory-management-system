name: 기능 개발
description: 없던 기능을 만든다
title: "feat(<scope>): "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: 무엇을 만들지만 씁니다. 어떻게 만들지는 작업 시작 시 기능 명세서(`docs/specs/`)로 작성합니다.
  - type: textarea
    id: background
    attributes:
      label: 배경 · 목적
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 요구사항
      placeholder: |
        - SKU와 수량으로 출고한다
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 동작으로 검증할 수 있게 (예. 재고보다 많이 출고하면 거절된다)
      placeholder: |
        - [ ] 재고보다 많이 출고하면 거절된다
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 범위 밖
  - type: textarea
    id: questions
    attributes:
      label: Open Questions
      description: 불명확한 부분. 추측해서 채우지 않습니다
