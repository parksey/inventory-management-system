spring:
  flyway:
    enabled: false                # 마이그레이션은 앱보다 먼저 flyway 이미지(support/flyway/Dockerfile)가 적용한다

decorator:
  datasource:
    enabled: false

springdoc:                        # 운영 기본은 비공개, compose 데모만 SWAGGER_ENABLED=true로 켠다
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  structured:
    format:
      console: ecs                # 한 줄에 JSON 하나. MDC의 traceId도 필드로 들어간다
    ecs:
      service:
        node-name: ${HOSTNAME:}   # 어느 replica가 남긴 로그인지 (컨테이너 호스트명)
