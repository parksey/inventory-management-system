spring:
  profiles:
    default: local
  application:
    name: inventory
  config:
    import: classpath:inventory-db.yml
  jpa:
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
