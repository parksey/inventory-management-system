spring:
  profiles:
    default: local
  task:
    scheduling:
      pool:
        size: 3
  application:
    name: inventory
  config:
    import: classpath:inventory-db.yml
  jpa:
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

inventory:
  outbox:
    interval: 1s
    recovery-interval: 10s
  erp:
    lookup-backoff: 10s, 1m, 5m, 15m, 1h

server:
  shutdown: graceful
  servlet:
    context-path: /api

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # Prometheus에서 p95, p99를 계산할 수 있게 구간별 건수를 낸다

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
