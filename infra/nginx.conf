events {}

http {
    log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr';
    access_log /dev/stdout upstream;

    upstream inventory_app {
        server app:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://inventory_app;
            proxy_set_header Host $http_host;   # 포트까지 넘겨야 Swagger가 localhost:8080으로 요청한다
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
