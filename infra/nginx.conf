worker_processes auto;            # 기본 1개. 부하 테스트에서 앱보다 nginx가 먼저 막히지 않게 CPU 수만큼

events {
    worker_connections 4096;      # 기본 512. 요청 하나가 클라이언트, 앱 쪽 연결 두 개를 쓴다
}

http {
    log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr';
    access_log /dev/stdout upstream;

    upstream inventory_app {
        server app:8080;
        keepalive 64;             # 앱 연결을 요청마다 새로 열지 않고 재사용한다
    }

    server {
        listen 80;

        location / {
            proxy_pass http://inventory_app;
            proxy_http_version 1.1;             # keepalive는 HTTP/1.1에서만 된다
            proxy_set_header Connection "";     # 클라이언트의 Connection: close를 앱 쪽으로 넘기지 않는다
            proxy_set_header Host $http_host;   # 포트까지 넘겨야 Swagger가 localhost:8080으로 요청한다
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
