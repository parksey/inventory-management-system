apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s           # prometheus.yml의 scrape_interval과 맞춘다

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
